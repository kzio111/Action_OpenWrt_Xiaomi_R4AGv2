#
# 基于 P3TERX Actions-OpenWrt 修改
# 目标: 小米 4A 千兆版 V2 (R4AGv2) + LEDE 源码 + UA2F 插件
#

name: Build-LEDE-R4AGv2-UA2F

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接至 Actions'
        required: false
        default: 'false'
  repository_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: 20221001
  FEEDS_CONF: LEDE/feeds.conf.default
  CONFIG_FILE: LEDE/light-R4AGv2.config
  DIY_P1_SH: LEDE/light-part1_feeds.sh
  DIY_P2_SH: LEDE/light-part2_config.sh
  DIY_P3_SH: LEDE/light-part3_mv.sh
  PATCH_FILE: 476-mtd-spi-nor-add-eon-en25q128.patch
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04   # ✅ 改成 22.04，减少排队

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone --single-branch --branch $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Upload Files for Hardware Changes
      run: |
        cp $GITHUB_WORKSPACE/LEDE/hw2add/$PATCH_FILE $GITHUB_WORKSPACE/openwrt/target/linux/generic/pending-5.4/$PATCH_FILE
        rm -f $GITHUB_WORKSPACE/openwrt/target/linux/generic/pending-5.4/499-mtd-spi-nor-add-xmc-xm25qh128c.patch
        cp -f $GITHUB_WORKSPACE/LEDE/hw2add/mt7621_xiaomi_mi-router-4a-gigabit-v2.dts $GITHUB_WORKSPACE/openwrt/target/linux/ramips/dts
        cp -f $GITHUB_WORKSPACE/LEDE/hw2add/mt7621.mk $GITHUB_WORKSPACE/openwrt/target/linux/ramips/image
        cp -f $GITHUB_WORKSPACE/LEDE/hw2add/01_leds $GITHUB_WORKSPACE/openwrt/target/linux/ramips/mt7621/base-files/etc/board.d
        cp -f $GITHUB_WORKSPACE/LEDE/hw2add/02_network $GITHUB_WORKSPACE/openwrt/target/linux/ramips/mt7621/base-files/etc/board.d

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        # ✅ 增加 UA2F 源
        echo "src-git ua2f https://github.com/Zxilly/UA2F.git" >> openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        # ✅ 强制启用 UA2F 及依赖
        echo "CONFIG_PACKAGE_ua2f=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-ua2f=y" >> .config
        echo "CONFIG_PACKAGE_kmod-bpf=y" >> .config
        echo "CONFIG_PACKAGE_kmod-xdp=y" >> .config

    - name: Upload Custom Files
      run: |
        chmod +x $DIY_P3_SH
        $GITHUB_WORKSPACE/$DIY_P3_SH
